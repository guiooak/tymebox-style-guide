# Publishes the style guide from the app's repository (docs/brand), which is
# the source of truth, to https://guiooak.github.io/tymebox-style-guide/.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [brand-manual-updated]
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the manual from guiooak/tymebox
        run: |
          mkdir -p site
          curl -fsSL https://raw.githubusercontent.com/guiooak/tymebox/main/docs/brand/tymebox-brand-manual.html -o site/index.html
          cp site/index.html site/tymebox-brand-manual.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
